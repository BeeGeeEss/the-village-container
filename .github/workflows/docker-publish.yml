name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build_container:
    name: Build Container
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set repository name to lowercase
        run: |
          echo "REPO_LC=${REPO,,}" >> $GITHUB_ENV
        env:
          REPO: "${{ github.repository }}"

      - name: Get application version
        run: |
          echo "APP_VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV

      - name: Get short Git commit SHA
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LC }}:latest
            ghcr.io/${{ env.REPO_LC }}:development
            ghcr.io/${{ env.REPO_LC }}:${{ env.APP_VERSION }}
            ghcr.io/${{ env.REPO_LC }}:development-${{ env.APP_VERSION }}
            ghcr.io/${{ env.REPO_LC }}:sha-${{ env.SHORT_SHA }}
